[package]
name = "s3_bucket_perma_link"
version = "2.2.1"
edition = "2024"
# `readme-variables` reads these two on its way to the README template: the page's one-line
# description and the licence it names come from here rather than from the GitHub API, so a
# description edited in the web UI cannot change a rendered file with no commit behind it.
#
# There is still no `rust-version`, so the payload carries no `toolchain.msrv` and the README
# claims no minimum. A number here is a supported floor somebody has to test against.
description = "Serves S3 objects under fixed request paths, so a published link survives the object behind it changing."
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "s3_bucket_perma_link"

[features]
# Sentry is in the default set because the image this repository publishes reports to it: the
# Dockerfile uploads this build's debug symbols to a Sentry project before stripping, and the
# generated configuration contract, the README tables and `docs/config.contract.json` are all
# rendered from a default-feature build. A default-off feature would make those four artefacts
# describe a binary nobody ships.
#
# What the feature buys is a build that genuinely does not contain the SDK — `cargo build
# --no-default-features` links no `sentry*` crate, no second HTTP client and no TLS stack for
# it, and `telemetry.sentry.*` stops being a key the loader accepts at all. That last part is
# deliberate: a key that parses and does nothing is the failure this feature would otherwise
# introduce, so with the feature off `S3_PERMA_LINK_TELEMETRY__SENTRY__ENABLED` is refused at
# boot as an unknown variable rather than silently ignored.
default = ["sentry"]
sentry = ["dep:sentry"]

[dependencies]
getset = "0.1.2"
derive-new = "0.7.0"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
tokio-stream = "0.1.14"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
anyhow = { version = "1.0.86", features = ["backtrace"] }
thiserror = "2.0.0"
actix-web = { version = "4.9.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "cookies"] } # Guessed features, but safer to stick to default if unsure. Reverting to default for actix-web to avoid breakage unless specified.
tracing-actix-web = "0.7.12"
# `derive` is declared here rather than left to feature unification: `src/config.rs` writes
# `#[derive(Deserialize, Serialize)]`, so the crate that names it is the crate that needs it.
serde = { version = "1.0.209", features = ["derive"] }
rust-s3 = { version = "0.37.1", default-features = false, features = ["tokio-rustls-tls"] }
# Error reporting and distributed tracing, behind the `sentry` feature above and inert at
# runtime until an operator sets `telemetry.sentry.enabled`. One crate rather than three:
# `sentry` re-exports `sentry-tracing` and `sentry-actix` under `sentry::integrations::*`, so
# the three versions cannot drift.
#
# `default-features = false` is load-bearing. The default set pulls `transport`, which is
# `reqwest + native-tls` — and `native-tls` links OpenSSL, which the runtime image does not
# ship. It also pulls `logs`, `metrics` and `release-health`: three further Sentry products
# this deployment does not use, each an egress channel with no key in the configuration
# reference describing it.
#
# What is on, and why:
#   actix         one hub and one transaction per request, named by the *matched route*
#                 (`GET /docs/{name}`) rather than by the URI, which is what stops every
#                 permanent link becoming its own transaction name.
#   backtrace     stack traces on events, plus the `in_app` frame classification.
#   contexts      the OS/runtime tag block. Kept from the previous declaration.
#   debug-images  the module list that symbolicates those traces against the debug files the
#                 Dockerfile uploads. Without it that upload buys nothing.
#   panic         the hook that turns a panic into an issue.
#   reqwest       the transport itself, and the correction that motivated this bump: the
#                 previous declaration named `rustls` with no transport feature beside it, and
#                 `rustls` alone is only a TLS backend *for* one. The client therefore had no
#                 way to send and every captured event was dropped on the floor.
#   rustls        so that transport reuses the TLS stack `rust-s3` already builds rather than
#                 introducing OpenSSL.
#   tracing       the subscriber layer in `src/telemetry/sentry.rs` — the sink that turns the
#                 service's own `tracing` records into issues, breadcrumbs and spans.
#
# `anyhow` was declared before this and used by nothing; it is dropped rather than carried.
sentry = { version = "0.49.1", default-features = false, optional = true, features = [
    "actix",
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "reqwest",
    "rustls",
    "tracing",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
# The layered configuration loader: struct defaults, TOML, environment, mounted secrets, and
# the supervisor that rebuilds the service when a mounted secret is rotated. Pinned by tag
# rather than a branch so a version change is visible in review.
#
# `full` is `loader` + `reload` + `schema` + `explain`:
#   loader  the layering itself.
#   reload  the loader alone would leave a rotated S3 credential unseen until the pod restarts.
#   schema  `examples/config-schema.rs` and `examples/readme-variables.rs` generate the README
#           configuration tables from the types in `src/config.rs`, so the reference cannot drift
#           from the code — and the same example generates the configuration *contract* the
#           container build embeds in the image and attaches to its digest, together with the
#           `dev.terrace.config.*` labels that make it discoverable. Nothing in the binary calls
#           it, and release LTO drops it.
#   explain which layer supplied each key, logged once per generation in `main` — the answer to
#           "the mounted secret is not being picked up" without attaching a debugger.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.11.0", default-features = false, features = ["full"] }
# `CancellationToken`, the shutdown/reload signal the supervisor and the listener share.
tokio-util = "0.7.19"

[dev-dependencies]
# The same crate again, for its `testing` feature: the sandbox the loader tests arrange their
# layers in. It is deliberately outside `full`, because a service image has no reason to link a
# test harness — a dev-dependency on the same tag is how it is meant to be taken.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.11.0", default-features = false, features = ["testing"] }
# `examples/readme-variables.rs` assembles the README template payload. Building it here rather
# than by hand is what makes the embedded Markdown tables safe: a `|` or a newline inside a
# generated cell is a JSON escape, not a broken document.
serde_json = "=1.0.151"

[profile.release]
lto = true
codegen-units = 1
debug = true

# One package, but the tables are declared on the workspace so that a second crate added here
# inherits them by writing one line rather than by copying nine.
[lints]
workspace = true

[workspace]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Already inside `pedantic`. Named again so the next reader can tell they were chosen rather
# than swept in with the group.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"
doc_include_without_cfg = "warn"

[workspace.lints.rustdoc]
# Denied rather than warned: a broken link renders as the literal `[`Foo`]` on the page, so it is
# invisible to the reader and visible only to the person who no longer needs it.
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

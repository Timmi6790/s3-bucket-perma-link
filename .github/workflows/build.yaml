name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-cargo-check-v1.1.6

  coverage:
    name: Coverage
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@30bc73a560c7aac65f449b23378b9fd7782f8d39 # tag=actions-rust-coverage-codecov-v1.1.44
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  fmt:
    name: Auto Format
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    # Shared with docs.yml, which renders README.md onto the same branch. Both make verified
    # commits through the API, and that call rejects a commit whose parent has moved — so two of
    # them racing would leave one failing for no reason a reader could act on. They queue instead.
    concurrency:
      group: branch-writes-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Auto Format
        uses: TimSchoenle/actions/actions/rust/auto-format@cf936b448984595778c82c079af93d0bb5d49297 # tag=actions-rust-auto-format-v1.1.15
        with:
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-clippy-v1.1.10

  # The rustdoc lints in [workspace.lints.rustdoc] only run under `rustdoc`, never under
  # `cargo check` or `cargo clippy`, so a broken intra-doc link is invisible to every other job
  # here. `RUSTDOCFLAGS` is where the deny lands, because rustdoc reads it and `cargo doc` has no
  # flag for it.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Render the documentation
        run: cargo doc --all-features --no-deps

      # The `test` job is `cargo nextest`, which runs no doctest at all. This step is the only
      # place in CI the example on `DownloadData::get_entry` is compiled and asserted.
      - name: Run the doctests
        run: cargo test --doc --all-features

  docker-build-test:
    name: Docker Build and Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # `doc` as well as `check`: this job publishes the image and its configuration contract, and
    # the contract is generated from the same doc comments the documentation job renders. An
    # image whose contract came out of a crate that will not document is not one to build.
    needs: [check, doc]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: image:test
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      - name: Verify image architecture
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          expected="${PLATFORM#*/}"
          actual=$(docker image inspect image:test --format='{{.Architecture}}')
          echo "Expected: ${expected}, actual: ${actual}"
          [ "${expected}" = "${actual}" ]

      # The `contract` stage holds the two generated files and nothing else, so this exports a
      # two-file layer rather than the builder's filesystem. It runs on the builder the step
      # above already populated, so every layer is a cache hit and no second compile happens —
      # which is also what makes the exported document *the* document the image carries. The
      # build arguments have to match that build exactly, or the two would legitimately differ.
      - name: Export the generated configuration contract
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build \
            --target contract \
            --platform "${PLATFORM}" \
            --build-arg version=test \
            --build-arg release=test \
            --build-arg vendor=Timmi6790 \
            --build-arg VERSION=test \
            --cache-from "type=gha,scope=${PLATFORM_SLUG}" \
            --output "type=local,dest=contract-out" \
            .
          ls -l contract-out
          cat contract-out/contract.labels

      # The checkpoint the whole scheme rests on, and the reason a hand-written LABEL block is
      # safe. Checking the *image* rather than the Dockerfile is the point: a source diff cannot
      # see a base image that overrode a label, a `LABEL` line deleted on a branch nobody diffed,
      # or a build argument that failed to interpolate. Blocking, on every platform in the
      # matrix — labels live in each manifest's own config blob, so one architecture can carry
      # them while another does not.
      #
      # The toolchain is here rather than at the top of the job because only this step needs it:
      # the action renders the labels from `src/config.rs` itself rather than trusting a file
      # the build wrote, which is what lets it also check the Dockerfile region and the
      # committed document in the same pass.
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # This job publishes an image, and a restored cache is writable by any branch:
          # caching here would let a poisoned entry reach a runtime artefact. The only
          # thing compiled is the contract generator, so there is almost nothing to save.
          cache: false

      - name: Verify the image's configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@30bc73a560c7aac65f449b23378b9fd7782f8d39 # tag=actions-rust-config-contract-v1.3.0
        with:
          image: image:test

      - name: Test Docker image runs
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set +e
          output=$(docker run --rm image:test 2>&1)
          status=$?
          set -e
          echo "${output}"
          echo "Exit status: ${status}"
          # The image has no shell and the binary exits on missing configuration, so a
          # non-zero exit is expected. Exit codes in the 125-127 range mean the runtime
          # could not execute the binary at all, which is what a wrong-architecture or
          # broken (e.g. mis-packed) build looks like.
          if [ "${status}" -ge 125 ] && [ "${status}" -le 127 ]; then
            echo "::error::Container failed to execute the binary (exit ${status})"
            exit 1
          fi
          if echo "${output}" | grep -qi 'exec format error'; then
            echo "::error::Binary is not executable on ${PLATFORM}"
            exit 1
          fi

      - name: Check image size
        run: |
          SIZE=$(docker image inspect image:test --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "Image size: ${SIZE}MB"
          mkdir -p "${RUNNER_TEMP}/sizes"
          echo "${SIZE}" > "${RUNNER_TEMP}/sizes/${PLATFORM_SLUG}"
          if [ "${SIZE}" -gt 150 ]; then
            echo "::warning::Image size (${SIZE}MB) exceeds 150MB threshold"
          fi

      - name: Upload image size
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sizes-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/sizes/*
          if-no-files-found: error
          retention-days: 1

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: image:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ env.PLATFORM_SLUG }}

  docker-size-report:
    name: Docker Size Report
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download image sizes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: sizes
          pattern: sizes-*
          merge-multiple: true

      - name: Build image size comment body
        id: sizes_body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const rows = fs.readdirSync('sizes')
              .sort()
              .map((file) => {
                const platform = file.replace('-', '/');
                const size = fs.readFileSync(`sizes/${file}`, 'utf8').trim();
                return `| \`${platform}\` | ${size}MB |`;
              })
              .join('\n');
            core.setOutput('body', `🐳 **Docker image sizes**\n\n| Platform | Size |\n| --- | --- |\n${rows}`);

      - name: Comment image sizes on PR
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@cf936b448984595778c82c079af93d0bb5d49297 # tag=actions-common-upsert-pr-comment-v1.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          identifier: docker-image-size
          body: ${{ steps.sizes_body.outputs.body }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
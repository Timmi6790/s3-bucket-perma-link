name: release-please
on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

env:
  DOCKER_REPO: timmi6790/s3-bucket-perma-link
  HELM_REPO: TimSchoenle/helm-charts
  CHART_PATH: charts/s3-bucket-perma-link
  # The artifact type the configuration contract is attached under. The chart repository
  # discovers referrers by this exact string; changing it makes the contract invisible there
  # rather than failing anywhere here.
  CONTRACT_ARTIFACT_TYPE: application/vnd.terrace.config-schema.v1+json
  # Pinned to what TimSchoenle/helm-charts pins in its `justfile`, because these are the two
  # tools whose output that repository reads back. Bump them together with it.
  ORAS_VERSION: 1.3.3
  COSIGN_VERSION: v3.1.3

jobs:
  release-please:
    environment:
      name: release
      deployment: false
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release commits and tags
      issues: write # Required to create release issues
      pull-requests: write # Required to create release PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.generate_token.outputs.token }}

  docker-build:
    environment:
      name: release
      deployment: false
    name: Docker Build (${{ matrix.platform }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels, annotations) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_REPO }}

      # Pushed by digest only; the tags are attached to the manifest list in docker-release.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            version=${{ needs.release-please.outputs.tag_name }}
            release=${{ needs.release-please.outputs.tag_name }}
            vendor=Timmi6790
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            VERSION=${{ needs.release-please.outputs.tag_name }}
          secrets: |
            sentry_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Runs on the builder the push above already populated, so every layer is a cache hit and
      # the exported document is the one that went into the image. The build arguments have to
      # match that build exactly — `version` reaches the contract's `app` block, so a different
      # value here would produce a different document and the comparison below would fail for a
      # reason that is not a defect.
      - name: Export the generated configuration contract
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          docker buildx build \
            --target contract \
            --platform "${PLATFORM}" \
            --build-arg "version=${TAG_NAME}" \
            --build-arg "release=${TAG_NAME}" \
            --build-arg vendor=Timmi6790 \
            --build-arg "VERSION=${TAG_NAME}" \
            --output "type=local,dest=contract-out" \
            .
          cat contract-out/contract.labels

      # The gate everything downstream is allowed to trust. It runs against the image that was
      # actually pushed, per platform: labels live in each manifest's own config blob, so one
      # architecture can carry them while another does not, and each matrix leg is the only run
      # that sees its own. `docker-release` needs this job, so nothing is tagged, attached or
      # signed until every platform has passed.
      #
      # The floating tags do not exist yet — they are created from these digests in
      # `docker-release` — so a failure here costs a retry rather than a release.
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # This job publishes an image, and a restored cache is writable by any branch:
          # caching here would let a poisoned entry reach a runtime artefact. The only
          # thing compiled is the contract generator, so there is almost nothing to save.
          cache: false

      - name: Pull the pushed image
        env:
          IMAGE: ${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull --quiet "${IMAGE}@${DIGEST}"

      # The labels are constants for this service, so they do not depend on the `version` this
      # build was given: the action renders them from the types and compares them with what the
      # pushed manifest's config blob carries. The document inside the image does name this
      # build, which is why the action checks that it is there and a contract rather than
      # diffing it against a fresh, versionless render.
      - name: Verify the pushed image's configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@cf936b448984595778c82c079af93d0bb5d49297 # tag=actions-rust-config-contract-v1.3.1
        with:
          image: ${{ env.DOCKER_REPO }}@${{ steps.build.outputs.digest }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # The bytes `docker-release` attaches to the manifest list's digest. Uploaded from every
      # platform rather than one, so that job can prove the two builds produced the same document
      # before publishing either — the generator reads nothing architecture-dependent, and a
      # difference would mean one of the two images describes a configuration the other does not.
      - name: Upload the generated configuration contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contract-${{ env.PLATFORM_SLUG }}
          path: contract-out/contract.json
          if-no-files-found: error
          retention-days: 1

  docker-release:
    environment:
      name: release
      deployment: false
    name: Docker Release
    needs: [ release-please, docker-build ]
    if: ${{ needs.release-please.outputs.release_created }}
    outputs:
      image_digest: ${{ steps.manifest.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required for OIDC authentication with Cosign
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Pinned to the release the chart repository verifies with, so a signature this job writes
      # and a signature that job reads are never produced by two versions that disagree about the
      # bundle format.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Create and push manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.DOCKER_REPO }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect manifest list
        env:
          IMAGE: ${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Sign the images with GitHub OIDC Token
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      # --------------------------------------------------------------------------------------
      # The configuration contract
      # --------------------------------------------------------------------------------------
      #
      # Published only now, because `docker-build` is a dependency of this job and every platform
      # in it checked the labels on the image it had just pushed. Nothing is attached or signed
      # until that has passed.
      #
      # The document is attached to the *digest*, not to a tag: a tag can be moved, and the
      # attachment is the only tie between an image and its contract. There is no digest field
      # inside the document to fill in — a digest is what building an image produces, so writing
      # one would change bytes that were already generated and already checked.

      - name: Download the generated configuration contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/contracts
          pattern: contract-*

      # One document for the whole manifest list, so the platforms have to agree on it. The
      # generator reads nothing architecture-dependent, so a difference here is not a platform
      # quirk — it means one of the two images describes a configuration the other does not, and
      # publishing either as "the" contract for the index would be a guess.
      - name: Verify every platform generated the same contract
        id: contract
        working-directory: ${{ runner.temp }}/contracts
        run: |
          set -euo pipefail
          reference=""
          for candidate in */contract.json; do
            if [ -z "${reference}" ]; then
              reference="${candidate}"
              continue
            fi
            if ! cmp --silent "${reference}" "${candidate}"; then
              echo "::error::${reference} and ${candidate} are different documents; the" \
                   "platforms of one manifest list do not agree on what this image reads"
              cmp "${reference}" "${candidate}" || true
              exit 1
            fi
          done
          if [ -z "${reference}" ]; then
            echo "::error::no contract was uploaded by any platform"
            exit 1
          fi
          echo "path=${RUNNER_TEMP}/contracts/${reference}" >> "$GITHUB_OUTPUT"
          echo "every platform published the same contract ($(wc -c < "${reference}") bytes)"

      # Pinned to the release the chart repository pins, as Cosign is above. Installed by URL
      # rather than by action for the same reason that repository does it: one fewer third party
      # in the path that publishes what a chart will trust.
      - name: Install ORAS
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version

      # Attached verbatim: the bytes the generator wrote inside the build, checked against the
      # copy inside the image, with nothing added afterwards. The chart repository reads both
      # carriers and refuses the image if they differ.
      #
      # The reference is spelled out with its registry. `oras` does not apply Docker's implicit
      # `docker.io` default: it reads the first segment of a bare `user/repo` as a registry
      # hostname and tries to resolve it in DNS. Everything else in this job — buildx, cosign —
      # defaults the registry itself, which is why these two steps are the only place it is
      # written.
      - name: Attach the configuration contract to the image digest
        env:
          IMAGE: docker.io/${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          CONTRACT: ${{ steps.contract.outputs.path }}
          ARTIFACT_TYPE: ${{ env.CONTRACT_ARTIFACT_TYPE }}
        run: |
          set -euo pipefail
          cd "$(dirname "${CONTRACT}")"
          oras attach --artifact-type "${ARTIFACT_TYPE}" \
            "${IMAGE}@${DIGEST}" \
            "$(basename "${CONTRACT}"):application/json"

      # The referrer is a manifest of its own, and signing it is what lets a consumer trust the
      # document without trusting whoever could push to this repository. The subject digest is
      # already signed by the step above; this signs the attachment.
      - name: Sign the attached contract with GitHub OIDC Token
        env:
          IMAGE: docker.io/${{ env.DOCKER_REPO }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          ARTIFACT_TYPE: ${{ env.CONTRACT_ARTIFACT_TYPE }}
        run: |
          set -euo pipefail
          # Polled rather than read once. Docker Hub's referrers index is eventually consistent:
          # the attach above returns as soon as the referrer manifest is stored, but
          # `/v2/.../referrers/<digest>` keeps answering with an empty index for seconds
          # afterwards, which fails this step over a contract that is in fact attached.
          #
          # `oras discover` has spelled its top-level key differently across releases; both are
          # accepted rather than pinning the shape to the version that happens to be installed.
          referrers=""
          count=0
          for attempt in 1 2 3 4 5 6; do
            if [ "${attempt}" -gt 1 ]; then
              sleep $(( (attempt - 1) * 5 ))
            fi
            referrers="$(oras discover --format json --artifact-type "${ARTIFACT_TYPE}" "${IMAGE}@${DIGEST}")"
            count="$(jq '[.referrers // .manifests // []] | flatten | length' <<< "${referrers}")"
            if [ "${count}" != "0" ]; then
              break
            fi
          done
          if [ "${count}" != "1" ]; then
            echo "::error::expected exactly one ${ARTIFACT_TYPE} referrer on ${IMAGE}@${DIGEST} within 75s of attaching it, found ${count}"
            exit 1
          fi
          reference="$(jq -r '[.referrers // .manifests // []] | flatten | .[0].reference // empty' <<< "${referrers}")"
          if [ -z "${reference}" ]; then
            reference="${IMAGE}@$(jq -r '[.referrers // .manifests // []] | flatten | .[0].digest' <<< "${referrers}")"
          fi
          echo "signing ${reference}"
          cosign sign --yes "${reference}"

  sentry-release:
    environment:
      name: release
      deployment: false
    name: Sentry Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sentry Release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          version: ${{ needs.release-please.outputs.tag_name }}
          environment: production

  helm-release:
    environment:
      name: release
      deployment: false
    name: Helm Release
    needs: [ release-please, docker-release ]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: TimSchoenle/actions/actions/helm/update-chart-version@cf936b448984595778c82c079af93d0bb5d49297 # tag=actions-helm-update-chart-version-v1.6.8
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.HELM_REPO }}
          chart-path: ${{ env.CHART_PATH }}
          app-version: ${{ needs.release-please.outputs.tag_name }}
          images: |
            {
              "image.tag": {
                "tag": "${{ needs.release-please.outputs.tag_name }}",
                "digest": "${{ needs.docker-release.outputs.image_digest }}"
              }
            }